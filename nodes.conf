# pcpNetAudio - inventaire des nœuds
#
# Le parc est HÉTÉROGÈNE : modèles de Raspberry Pi et HAT audio différents
# d'un nœud à l'autre. Ce fichier doit refléter le matériel réel, pas une
# hypothèse d'uniformité.
#
#   ./fleet.sh inventory          # reconnaissance complète, lisible
#   ./fleet.sh inventory --conf   # lignes prêtes à coller ci-dessous
#
# Format :  name  ip  role  alsa_mode  atten  card
#
#   name       nom du client snapcast, et cible pour deploy.sh / fleet.sh
#   ip         adresse du nœud
#   role       client | skip
#   alsa_mode  hw    = bit-perfect, services exclusifs, bascule pcpna-mode  [DÉFAUT]
#              dmix  = cohabitation simultanée, bit-perfect sacrifié
#   atten      atténuation, mode dmix uniquement (0.3 ≈ -10 dB) ; "-" sinon
#   card       nom carte ALSA ; vide = auto-détection (exclut bcm2835)
#
# Il n'y a PAS de colonne de volume, et c'est délibéré : snapclient est lancé
# avec "--mixer none", le flux le traverse sans qu'un échantillon soit touché.
# Ni le volume logiciel (multiplication 16 bits) ni le volume matériel
# (atténuation 32 bits dans le DAC) ne sont bit-perfect sous 100 %. Le niveau
# se règle en ANALOGIQUE, sur les amplis de zone.
#
# Le snapserver se définit hors de ce fichier :
#   SNAPSERVER=192.168.1.27 ./deploy.sh
#
# ---------------------------------------------------------------------------
# RELEVÉ RÉEL — ./fleet.sh inventory, 14 août 2026
#
#   nœud         modèle              rev      arch     RAM     HAT                 mixer
#   pcpDJ        Pi 3 Model B+       a020d3   armv7l   921 Mo  HiFiBerry DAC+ Pro  oui
#   pcpBunker    Pi Zero W           9000c1   armv6l   427 Mo  HiFiBerry DAC       NON
#   pcpKitchen   Pi Zero 2 W         902120   armv7l   426 Mo  HiFiBerry DAC       NON
#   pcpLobby     Pi Zero 2 W         902120   armv7l   426 Mo  HiFiBerry DAC       NON
#
# Les quatre sont en FILAIRE (eth0). Les trois Zero n'ayant pas d'Ethernet
# natif, ils passent par un adaptateur USB. Aucun nœud n'est en Wi-Fi : les
# cibles de latence peuvent rester basses, pas besoin de relever le buffer.
#
# pcpBunker est un Zero W de PREMIÈRE génération, pas un Zero 2 : ARMv6 mono-
# cœur, VFPv2, sans NEON. Ce n'est pas bloquant — le .deb armhf de snapcast est
# compilé pour ARMv6 (Tag_CPU_arch: v6, Tag_FP_arch: VFPv2, vérifié au readelf)
# et le dépôt pCP "armhf" est commun aux deux architectures. Avec codec=pcm
# snapclient ne décode rien, ce qui ménage le mono-cœur. À surveiller quand
# même : c'est le seul nœud susceptible de décrocher sur la synchro à 20 ms.
#
# Les trois HiFiBerry DAC n'ont AUCUN mixer ALSA (pas de volume matériel) :
# le volume doit se faire côté snapcast, et en mode dmix l'atténuation
# logicielle serait obligatoire. Seul pcpDJ a un DAC+ Pro avec mixer.
#
# `card` est renseigné partout : sur pcpDJ l'audio interne bcm2835 est encore
# actif (card 0 « Headphones »), et l'auto-détection de probe.sh a déjà pris la
# mauvaise carte une fois. Sur les trois autres il n'y a qu'une carte, mais
# expliciter coûte zéro et supprime toute ambiguïté future.

# name       ip             role     mode   atten  card
pcpDJ        192.168.1.23   client   hw     -      sndrpihifiberry
pcpBunker    192.168.1.22   client   hw     -      sndrpihifiberry
pcpKitchen   192.168.1.24   client   hw     -      sndrpihifiberry
pcpLobby     192.168.1.26   client   hw     -      sndrpihifiberry

# Exemple : nœud avec un HAT différent, carte forcée
# pcpSalon   192.168.1.30   client   hw     -      IQaudIODAC

# Exemple : zone où les deux sources doivent sonner simultanément
# pcpCuisine 192.168.1.31   client   dmix   0.3

# Exemple : nœud temporairement hors périmètre
# pcpTest    192.168.1.99   skip
